      - name: Build APK
        working-directory: ${{ runner.temp }}/proj
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | grep -v '^\s*at ' | tail -40

      - name: Ganti nama APK
        run: cp "$RUNNER_TEMP/proj/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/NatkitTimer.apk"

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: NatkitTimer-apk
          path: ${{ runner.temp }}/NatkitTimer.apk

      - name: Buat Release (link unduh langsung)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "$RUNNER_TEMP/NatkitTimer.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "NatkitTimer build ${{ github.run_number }}" \
            --notes "APK debug NatkitTimer."
